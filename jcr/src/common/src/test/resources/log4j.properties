# Default global level (options: debug, info, warn, error, fatal)
log4j.rootLogger=${log.root}

# Set log levels
log4j.logger.org.apache.jackrabbit.core=WARN

# Log to console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss} [%-5p] %c{7} - %m%n